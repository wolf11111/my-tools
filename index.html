<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>硬件分拣助手 v5.0</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <style>
        :root { --primary: #00ff88; --bg: #000; --card: rgba(15, 23, 42, 0.95); }
        body { margin: 0; background: var(--bg); color: white; font-family: sans-serif; height: 100vh; overflow: hidden; }
        #webcam-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        canvas { width: 100%; height: 100%; object-fit: cover; }
        
        #ui-layer { position: absolute; bottom: 0; left: 0; width: 100%; z-index: 2; padding-bottom: env(safe-area-inset-bottom); }
        .top-nav { position: fixed; top: 10px; right: 10px; z-index: 100; display: flex; gap: 10px; }
        
        #result-panel { margin: 12px; background: var(--card); border-radius: 20px; padding: 18px; border: 1px solid rgba(0,255,136,0.2); backdrop-filter: blur(15px); }
        .item-photo-preview { width: 60px; height: 60px; border-radius: 10px; border: 2px solid var(--primary); object-fit: cover; margin-right: 12px; display: none; }
        
        /* 画廊弹窗 */
        #gallery-modal { display:none; position:fixed; inset:0; background:#0f172a; z-index:300; padding:20px; overflow-y:auto; }
        .inventory-card { background:#1e293b; border-radius:15px; padding:12px; margin-bottom:12px; display:flex; align-items:center; }
        .inventory-img { width:80px; height:80px; border-radius:10px; object-fit:cover; margin-right:15px; }

        button { padding: 10px 15px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; }
        .btn-main { background: var(--primary); color: #064e3b; }
        .btn-sub { background: #334155; color: #fff; }
        #version-tag { position: fixed; top: 10px; left: 10px; z-index: 100; font-size: 10px; color: #00ff88; }
    </style>
</head>
<body>
    <div id="version-tag">VER: 5.0.20260223</div>
    
    <div class="top-nav">
        <button class="btn-sub" onclick="openGallery()" style="font-size:0.8rem">📦 查看库存</button>
        <button class="btn-sub" onclick="openRules()" style="font-size:0.8rem">⚙️ 规划</button>
    </div>

    <div id="webcam-container"></div>

    <div id="ui-layer">
        <div id="result-panel">
            <div style="display: flex; align-items: center; margin-bottom: 10px;">
                <canvas id="snapshot-canvas" style="width:60px; height:60px; border-radius:8px; display:none; border:2px solid var(--primary)"></canvas>
                <div>
                    <div id="labelName" style="font-size: 1.2rem; font-weight: bold;">等待识别...</div>
                    <div id="posText" style="color: var(--primary); font-size: 0.9rem;">-</div>
                </div>
            </div>

            <div id="actionArea" style="display: none;">
                <button class="btn-main" style="width:100%" onclick="confirmAndCapture()">拍照并确认入库</button>
                <button class="btn-sub" style="width:100%; margin-top:8px;" onclick="resetLock()">重试</button>
            </div>
        </div>
    </div>

    <div id="gallery-modal">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h2 style="margin:0; color:var(--primary)">库存快照检索</h2>
            <button onclick="document.getElementById('gallery-modal').style.display='none'" class="btn-sub">返回</button>
        </div>
        <div id="gallery-list"></div>
    </div>

    <script>
        const URL = "https://teachablemachine.withgoogle.com/models/vldTQXnhJ/";
        let model, webcam, isLocked = false, currentMatchRule = null;
        
        // 核心数据：存放在 localStorage
        let inventory = JSON.parse(localStorage.getItem('hardware_inventory_v5')) || [];
        let myRules = JSON.parse(localStorage.getItem('sorting_rules_v4.4')) || [];

        async function init() {
            model = await tmImage.load(URL + "model.json", URL + "metadata.json");
            webcam = new tmImage.Webcam(window.innerWidth, window.innerHeight, false);
            await webcam.setup({ facingMode: "environment" });
            await webcam.play();
            document.getElementById("webcam-container").appendChild(webcam.canvas);
            window.requestAnimationFrame(loop);
        }

        async function loop() {
            if (!isLocked) { webcam.update(); await predict(); }
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            let maxP = 0, match = "";
            for (let i = 0; i < model.getTotalClasses(); i++) {
                if (prediction[i].probability > maxP) { maxP = prediction[i].probability; match = prediction[i].className; }
            }
            if (maxP > 0.92 && match !== "Background") {
                isLocked = true;
                currentMatchRule = myRules.find(r => r.keywords.split(',').some(k => match.toLowerCase().includes(k.trim().toLowerCase())));
                showMatch(match);
            }
        }

        function showMatch(name) {
            document.getElementById("labelName").innerText = name;
            document.getElementById("posText").innerText = currentMatchRule ? currentMatchRule.pos : "柜子B-中层 (建议)";
            document.getElementById("actionArea").style.display = "block";
        }

        // --- 核心：入库并拍照 ---
        function confirmAndCapture() {
            // 1. 截取当前摄像头画面
            const snapCanvas = document.createElement('canvas');
            snapCanvas.width = webcam.canvas.width;
            snapCanvas.height = webcam.canvas.height;
            snapCanvas.getContext('2d').drawImage(webcam.canvas, 0, 0);
            const photoData = snapCanvas.toDataURL('image/jpeg', 0.5); // 压缩质量0.5减少内存占用

            // 2. 保存到库存记录
            const newItem = {
                name: document.getElementById("labelName").innerText,
                pos: document.getElementById("posText").innerText,
                time: new Date().toLocaleString(),
                photo: photoData
            };
            inventory.unshift(newItem); // 最新存入的放前面
            localStorage.setItem('hardware_inventory_v5', JSON.stringify(inventory));

            alert("入库成功！照片已关联。");
            resetLock();
        }

        function openGallery() {
            const list = document.getElementById("gallery-list");
            list.innerHTML = inventory.length ? "" : "<p style='color:#666'>暂无库存，请先入库。</p>";
            inventory.forEach((item, index) => {
                list.innerHTML += `
                    <div class="inventory-card">
                        <img src="${item.photo}" class="inventory-img">
                        <div style="flex:1">
                            <div style="font-weight:bold; color:var(--primary)">${item.name}</div>
                            <div style="font-size:0.8rem; margin:4px 0;">📍 ${item.pos}</div>
                            <div style="font-size:0.6rem; color:#666;">时间: ${item.time}</div>
                        </div>
                        <button onclick="deleteItem(${index})" style="background:none; color:#ff4444; font-size:0.7rem;">移除</button>
                    </div>`;
            });
            document.getElementById("gallery-modal").style.display = "block";
        }

        function deleteItem(index) {
            if(confirm("确定移除该物品记录吗？")) {
                inventory.splice(index, 1);
                localStorage.setItem('hardware_inventory_v5', JSON.stringify(inventory));
                openGallery();
            }
        }

        function resetLock() { isLocked = false; document.getElementById("actionArea").style.display = "none"; document.getElementById("labelName").innerText = "扫描中..."; }
        window.onload = init;
    </script>
</body>
</html>
