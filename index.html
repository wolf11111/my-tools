<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>硬件分拣助手 v1.0</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <style>
        body { margin: 0; background: #000; color: white; font-family: -apple-system, sans-serif; overflow: hidden; }
        
        /* 视频容器：全屏置底 */
        #webcam-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
        }
        canvas { width: 100%; height: 100%; object-fit: cover; }

        /* UI 遮罩层：置顶 */
        #ui-overlay {
            position: relative;
            z-index: 2;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.2);
            pointer-events: none;
        }

        #header { padding: 20px; background: rgba(0,0,0,0.5); width: 100%; text-align: center; }
        
        /* 识别结果显示区 */
        #result-card {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            margin-bottom: 50px;
            padding: 20px 40px;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            pointer-events: auto;
            transition: all 0.3s;
        }

        #label { font-size: 2rem; font-weight: bold; display: block; }
        #probability { font-size: 0.9rem; color: #666; }

        /* 扫描动画 */
        .scanner-line {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2px;
            background: rgba(0, 255, 0, 0.5);
            box-shadow: 0 0 15px #0f0;
            animation: scan 3s infinite linear;
            z-index: 1;
        }
        @keyframes scan {
            0% { top: 0%; }
            100% { top: 100%; }
        }
    </style>
</head>
<body>

    <div id="webcam-container"></div>
    <div class="scanner-line"></div>

    <div id="ui-overlay">
        <div id="header">
            <h3>硬件分拣 AI 助手</h3>
        </div>
        
        <div id="result-card">
            <span id="label">正在启动模型...</span>
            <span id="probability">请允许摄像头访问</span>
        </div>
    </div>

    <script type="text/javascript">
        // 你的模型链接
        const URL = "https://teachablemachine.withgoogle.com/models/vldTQXnhJ/";

        let model, webcam, labelContainer, maxPredictions;

        async function init() {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            try {
                // 加载模型
                model = await tmImage.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();

                // 摄像头配置
                const flip = false; // 后置摄像头不需要镜像
                const width = window.innerWidth;
                const height = window.innerHeight;
                
                webcam = new tmImage.Webcam(width, height, flip);
                
                // 关键：请求后置摄像头
                await webcam.setup({ facingMode: "environment" }); 
                
                await webcam.play();
                window.requestAnimationFrame(loop);

                // 将摄像头画面渲染到容器
                document.getElementById("webcam-container").appendChild(webcam.canvas);
                document.getElementById("label").innerHTML = "准备扫描";
            } catch (error) {
                console.error(error);
                document.getElementById("label").innerHTML = "启动失败";
                document.getElementById("probability").innerHTML = "请检查 HTTPS 环境或摄像头权限";
            }
        }

        async function loop() {
            webcam.update(); 
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            // 预测
            const prediction = await model.predict(webcam.canvas);
            
            // 找到置信度最高的分类
            let maxProb = 0;
            let bestClass = "";

            for (let i = 0; i < maxPredictions; i++) {
                if (prediction[i].probability > maxProb) {
                    maxProb = prediction[i].probability;
                    bestClass = prediction[i].className;
                }
            }

            // UI 更新策略：置信度需大于 85%
            const labelEl = document.getElementById("label");
            const probEl = document.getElementById("probability");

            if (maxProb > 0.85) {
                labelEl.innerHTML = bestClass;
                probEl.innerHTML = "匹配度: " + (maxProb * 100).toFixed(1) + "%";
                labelEl.style.color = "#008000";
            } else {
                labelEl.innerHTML = "扫描中...";
                probEl.innerHTML = "请对准物体";
                labelEl.style.color = "#666";
            }
        }

        // 自动启动
        window.onload = init;
    </script>
</body>
</html>
