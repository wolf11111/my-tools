<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>硬件分拣助手 v3.1</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <style>
        :root { --primary: #00ff00; --bg: #121212; --card: #252525; }
        body { margin: 0; background: var(--bg); color: white; font-family: sans-serif; overflow: hidden; }
        #webcam-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; opacity: 0.6; }
        canvas { width: 100%; height: 100%; object-fit: cover; }

        #ui-layer { position: relative; z-index: 2; height: 100vh; display: flex; flex-direction: column; justify-content: flex-end; }
        
        /* 版本号水印 */
        #version-tag {
            position: fixed; top: 10px; left: 10px; z-index: 100;
            font-size: 10px; color: rgba(255,255,255,0.4);
            background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 4px;
        }

        #result-panel { 
            margin: 20px; background: var(--card); border-radius: 20px; 
            padding: 20px; border: 2px solid #444; box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
        }
        #result-panel.locked { border-color: var(--primary); }

        .label-title { font-size: 1.5rem; font-weight: bold; color: var(--primary); display: flex; justify-content: space-between; }
        .guide-box { margin: 15px 0; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 10px; border-left: 4px solid #ffcc00; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        button { flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; }
        .btn-main { background: var(--primary); color: black; }
        .btn-sub { background: #444; color: white; }

        #edit-modal { 
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #333; padding: 25px; z-index: 100; border-radius: 20px; width: 80%;
        }
        input { width: 100%; padding: 10px; margin: 10px 0; background: #222; border: 1px solid #555; color: white; border-radius: 5px; }
    </style>
</head>
<body>

    <div id="version-tag">VER: 3.1.20240520</div>

    <div id="webcam-container"></div>

    <div id="ui-layer">
        <div id="result-panel">
            <div class="label-title">
                <span id="labelName">识别中...</span>
                <span id="probTag" style="font-size: 0.8rem; color: #888;">0%</span>
            </div>
            
            <div class="guide-box">
                <div style="font-size: 0.8rem; color: #aaa;">收纳地址：</div>
                <div id="posText">等待锁定...</div>
            </div>

            <div id="actionArea" style="display: none;">
                <div style="font-size: 0.8rem; color: #aaa; margin-bottom: 5px;">预设打印内容：</div>
                <div id="printPreview" style="background:#000; padding:10px; font-family:monospace; margin-bottom:15px; border:1px dashed #666;"></div>
                <div class="btn-group">
                    <button class="btn-main" onclick="copyPrintContent()">复制标签</button>
                    <button class="btn-sub" onclick="openEditModal()">修改配置</button>
                    <button class="btn-sub" style="flex:0.5" onclick="resetLock()">重试</button>
                </div>
            </div>
        </div>
    </div>

    <div id="edit-modal">
        <h3>配置收纳指引</h3>
        <p id="modal-item-name" style="color:var(--primary)"></p>
        <input type="text" id="input-pos" placeholder="输入收纳位置 (如：A柜-03盒)">
        <input type="text" id="input-tag" placeholder="输入打印简称 (如：STM32核心板)">
        <div class="btn-group">
            <button class="btn-main" onclick="saveConfig()">保存配置</button>
            <button class="btn-sub" onclick="closeEditModal()">取消</button>
        </div>
    </div>

    <script>
        // 逻辑部分保持 v3.0 稳定版，仅修正 UI 显示
        const URL = "https://teachablemachine.withgoogle.com/models/vldTQXnhJ/";
        let model, webcam, isLocked = false, currentClass = "";
        let localData = JSON.parse(localStorage.getItem('hardware_config') || '{}');

        async function init() {
            try {
                model = await tmImage.load(URL + "model.json", URL + "metadata.json");
                webcam = new tmImage.Webcam(window.innerWidth, window.innerHeight, flip = false);
                await webcam.setup({ facingMode: "environment" });
                await webcam.play();
                document.getElementById("webcam-container").appendChild(webcam.canvas);
                window.requestAnimationFrame(loop);
            } catch (e) {
                document.getElementById("labelName").innerText = "加载失败，请检查HTTPS";
            }
        }

        async function loop() {
            if (!isLocked) {
                webcam.update();
                await predict();
            }
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            let maxP = 0;
            let match = "";
            for (let i = 0; i < model.getTotalClasses(); i++) {
                if (prediction[i].probability > maxP) {
                    maxP = prediction[i].probability;
                    match = prediction[i].className;
                }
            }
            if (maxP > 0.90 && match !== "Background") {
                document.getElementById("labelName").innerText = match;
                document.getElementById("probTag").innerText = Math.round(maxP*100) + "%";
                currentClass = match;
                lockResult();
            }
        }

        function lockResult() {
            isLocked = true;
            const config = localData[currentClass] || { pos: "尚未配置位置", tag: currentClass };
            document.getElementById("posText").innerText = config.pos;
            document.getElementById("printPreview").innerText = `名称：${config.tag}\n地址：${config.pos}`;
            document.getElementById("result-panel").classList.add("locked");
            document.getElementById("actionArea").style.display = "block";
            if (navigator.vibrate) navigator.vibrate(50);
        }

        function resetLock() {
            isLocked = false;
            document.getElementById("result-panel").classList.remove("locked");
            document.getElementById("actionArea").style.display = "none";
            document.getElementById("labelName").innerText = "识别中...";
        }

        function openEditModal() {
            document.getElementById("modal-item-name").innerText = "正在配置：" + currentClass;
            const config = localData[currentClass] || { pos: "", tag: currentClass };
            document.getElementById("input-pos").value = config.pos;
            document.getElementById("input-tag").value = config.tag;
            document.getElementById("edit-modal").style.display = "block";
        }

        function closeEditModal() { document.getElementById("edit-modal").style.display = "none"; }

        function saveConfig() {
            const pos = document.getElementById("input-pos").value;
            const tag = document.getElementById("input-tag").value;
            localData[currentClass] = { pos, tag };
            localStorage.setItem('hardware_config', JSON.stringify(localData));
            closeEditModal();
            lockResult();
        }

        function copyPrintContent() {
            const content = document.getElementById("printPreview").innerText;
            navigator.clipboard.writeText(content).then(() => alert("打印内容已复制！"));
        }

        window.onload = init;
    </script>
</body>
</html>
